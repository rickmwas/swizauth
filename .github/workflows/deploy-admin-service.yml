name: Deploy Admin Service to Fly.io

on:
  push:
    branches: [main]
    paths:
      - 'admin-service/**'
      - '.github/workflows/deploy-admin-service.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Admin Service
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: admin-service/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./admin-service

      - name: Run tests
        run: npm run test --if-present
        working-directory: ./admin-service

      - name: Set up Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        working-directory: ./admin-service
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ Admin Service deployed successfully to https://tsauth-admin.fly.dev"

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "❌ Admin Service deployment failed"
          exit 1