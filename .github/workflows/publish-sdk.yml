name: Publish TSAUTH SDK

on:
  push:
    branches: [main]
    paths:
      - 'sdk/**'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: sdk/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./sdk

      - name: Run tests
        run: npm run test --if-present
        working-directory: ./sdk

      - name: Build SDK
        run: npm run build
        working-directory: ./sdk

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: sdk-dist
          path: sdk/dist/

  # Only publish on releases or manual trigger
  publish:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: sdk/package-lock.json
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci
        working-directory: ./sdk

      - name: Build SDK
        run: npm run build
        working-directory: ./sdk

      - name: Publish to NPM
        run: npm publish --access public
        working-directory: ./sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release (if not from release event)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: sdk-v${{ github.run_number }}
          release_name: TSAUTH SDK v${{ github.run_number }}
          body: |
            🚀 TSAUTH JavaScript SDK Release
            
            ## What's Changed
            - Updated SDK components and features
            
            ## Installation
            ```bash
            npm install @tsauth/js@latest
            ```
            
            ## Documentation
            See the [SDK README](./sdk/README.md) for usage instructions.
          draft: false
          prerelease: false