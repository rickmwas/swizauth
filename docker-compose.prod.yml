version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: swizauth-postgres-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-swizauth}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      - swizauth-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: swizauth-redis-prod
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - swizauth-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Auth Service (Go)
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: swizauth-auth-service
    environment:
      PORT: 8080
      ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-swizauth}?sslmode=disable
      REDIS_URL: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: 0
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      JWT_PRIVATE_KEY_PATH: certs/private.pem
      JWT_PUBLIC_KEY_PATH: certs/public.pem
      JWT_EXPIRY_MINUTES: 15
      REFRESH_TOKEN_EXPIRY_DAYS: 30
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
    ports:
      - "${AUTH_SERVICE_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - swizauth-network
    restart: unless-stopped

  # Admin Service (NestJS)
  admin-service:
    build:
      context: ./admin-service
      dockerfile: Dockerfile
    container_name: swizauth-admin-service
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-swizauth}?sslmode=disable
      REDIS_URL: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: 0
      AUTH_SERVICE_URL: http://auth-service:8080
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      LOG_LEVEL: info
    ports:
      - "${ADMIN_SERVICE_PORT:-3001}:3001"
    depends_on:
      - auth-service
      - postgres
      - redis
    networks:
      - swizauth-network
    restart: unless-stopped

  # Dashboard (Next.js)
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: swizauth-dashboard
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_AUTH_SERVICE_URL: ${NEXT_PUBLIC_AUTH_SERVICE_URL:-http://localhost:8080}
      NEXT_PUBLIC_ADMIN_SERVICE_URL: ${NEXT_PUBLIC_ADMIN_SERVICE_URL:-http://localhost:3001}
      SESSION_SECRET: ${SESSION_SECRET}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      - admin-service
    networks:
      - swizauth-network
    restart: unless-stopped

networks:
  swizauth-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: